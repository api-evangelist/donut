aid: donut
name: Donut
description: >-
  Donut is an employee experience platform that helps companies design, automate, and
  scale people programs directly inside Slack and Microsoft Teams. Best known for its
  intro and coffee-chat pairing bot, Donut runs onboarding journeys, team-connection and
  watercooler programs, peer recognition, and engagement surveys, and imports data from
  50+ HRIS systems (BambooHR, Greenhouse, Workday) alongside Zoom, Google Meet, and
  calendar integrations. It is trusted by 20,000+ teams including Anthropic, Figma, Carta,
  and Ramp. Donut authenticates users via Slack OAuth and is SOC 2 compliant. It does not
  currently publish a public developer API; its GitHub organization ships a Slack app
  template and internal tooling.
